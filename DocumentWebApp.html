<!DOCTYPE html>
<html lang="ru">
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f6f8; color: #18323f; font: 16px Arial, sans-serif; }
    main { width: min(100%, 520px); margin: auto; padding: 20px 16px 40px; }
    .card { background: white; border-radius: 16px; padding: 22px; box-shadow: 0 4px 18px #16384a18; }
    h1 { font-size: 25px; margin: 0 0 24px; }
    label { display: block; font-weight: 700; margin: 16px 0 7px; }
    input, select, button { width: 100%; min-height: 50px; border-radius: 10px; font-size: 16px; }
    input, select { border: 1px solid #9dafb8; padding: 10px 12px; background: white; }
    button { margin-top: 20px; border: 0; padding: 12px; color: white; background: #087f8c; font-weight: 700; }
    button:disabled { background: #a8b5ba; }
    .secondary { width: auto; min-height: 40px; margin: 0; padding: 8px 15px; background: #526e7b; }
    .hidden { display: none; }
    .message { white-space: pre-line; margin-top: 16px; padding: 13px; border-radius: 9px; }
    .error, .warning { background: #fff0ed; color: #8b271c; }
    .success { background: #e4f7ed; color: #116337; }
    .info { background: #edf6fa; }
    .document { border-top: 1px solid #d9e2e6; padding: 12px 0; }
    .document:first-child { border-top: 0; }
    .user { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: 24px; }
    #loading { text-align: center; margin: 12px; color: #526e7b; }
  </style>
</head>
<body><main>
  <section id="loginView" class="card">
    <h1>Документы — Осушение</h1>
    <form id="loginForm">
      <label for="login">Логин</label><input id="login" autocomplete="username" required>
      <label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Войти</button>
    </form>
    <div id="loginMessage" class="message error hidden" role="alert"></div>
  </section>

  <section id="appView" class="card hidden">
    <h1>Создание документа</h1>
    <form id="documentForm">
      <label for="object">Объект</label><select id="object" required></select>
      <label for="documentType">Тип документа</label><select id="documentType" required></select>
      <div id="existingBlock" class="info message hidden">
        <strong>Уже существующие документы:</strong>
        <div id="documents"></div><div id="nextDocument"></div>
      </div>
      <div id="warning" class="message warning hidden"></div>
      <label for="status">Статус документа</label><select id="status" required></select>
      <button id="createButton" type="submit" disabled>Создать документ</button>
    </form>
    <div id="formMessage" class="message hidden" role="status"></div>
    <div class="user"><span>Вошёл: <strong id="userName"></strong></span><button id="logout" class="secondary" type="button">Выйти</button></div>
  </section>
  <div id="loading" class="hidden">Загрузка…</div>
</main>
<script>
  'use strict';
  const state = { token: sessionStorage.getItem('documentWebToken') || '', allowed: false, busy: false };
  const el = id => document.getElementById(id);
  function server(functionName, ...args) {
    return new Promise((resolve, reject) => google.script.run
      .withSuccessHandler(resolve).withFailureHandler(error => reject(new Error(error && error.message ? error.message : 'Ошибка сервера.')))[functionName](...args));
  }
  function setBusy(value) { state.busy = value; el('loading').classList.toggle('hidden', !value); updateButton(); }
  function message(id, text, kind) { const node = el(id); node.textContent = text || ''; node.className = 'message ' + (kind || 'error') + (text ? '' : ' hidden'); }
  function option(value, text) { const node = document.createElement('option'); node.value = value; node.textContent = text; return node; }
  function fillSelect(id, items, label) { const select = el(id); select.replaceChildren(option('', label)); items.forEach(item => select.appendChild(option(item.id == null ? item : item.id, item.name == null ? item : item.name))); }
  function updateButton() { el('createButton').disabled = state.busy || !state.allowed || !el('object').value || !el('documentType').value || !el('status').value; }
  async function loadApp() {
    if (!state.token) return showLogin();
    setBusy(true);
    try {
      const data = await server('webAppGetInitialData', state.token);
      fillSelect('object', data.objects, 'Выберите объект'); fillSelect('documentType', data.documentTypes, 'Выберите тип'); fillSelect('status', data.statuses, 'Выберите статус');
      el('userName').textContent = data.user.fullName || data.user.login; el('loginView').classList.add('hidden'); el('appView').classList.remove('hidden'); state.allowed = false;
    } catch (error) { sessionStorage.removeItem('documentWebToken'); state.token = ''; showLogin(error.message); }
    finally { setBusy(false); }
  }
  function showLogin(error) { el('appView').classList.add('hidden'); el('loginView').classList.remove('hidden'); message('loginMessage', error || '', 'error'); }
  async function refreshExisting() {
    state.allowed = false; message('warning', ''); el('existingBlock').classList.add('hidden'); updateButton();
    if (!el('object').value || !el('documentType').value) return;
    setBusy(true);
    try {
      const data = await server('webAppGetExistingDocuments', state.token, el('object').value, el('documentType').value);
      const list = el('documents'); list.replaceChildren();
      if (!data.documents.length) { const empty = document.createElement('div'); empty.className = 'document'; empty.textContent = 'Нет созданных документов.'; list.appendChild(empty); }
      data.documents.forEach(item => { const card = document.createElement('div'); card.className = 'document'; [item.documentType, 'ID: ' + item.documentId, 'Статус: ' + item.documentStatus, 'Запись: ' + item.recordStatus].forEach(text => { const line = document.createElement('div'); line.textContent = text; card.appendChild(line); }); list.appendChild(card); });
      el('nextDocument').textContent = data.nextDocumentName ? 'Следующий документ: ' + data.nextDocumentName : ''; el('existingBlock').classList.remove('hidden'); message('warning', data.warning, 'warning'); state.allowed = data.allowed;
    } catch (error) { message('formMessage', error.message, 'error'); }
    finally { setBusy(false); }
  }
  el('loginForm').addEventListener('submit', async event => { event.preventDefault(); setBusy(true); message('loginMessage', ''); try { const result = await server('webAppLogin', el('login').value, el('password').value); state.token = result.token; sessionStorage.setItem('documentWebToken', state.token); el('password').value = ''; await loadApp(); } catch (error) { message('loginMessage', error.message, 'error'); } finally { setBusy(false); } });
  el('object').addEventListener('change', refreshExisting); el('documentType').addEventListener('change', refreshExisting); el('status').addEventListener('change', updateButton);
  el('documentForm').addEventListener('submit', async event => { event.preventDefault(); if (el('createButton').disabled) return; setBusy(true); message('formMessage', ''); try { const result = await server('webAppCreateDocument', state.token, { objectId: el('object').value, documentTypeId: el('documentType').value, documentStatus: el('status').value }); if (!result.ok) { message('formMessage', result.message, 'warning'); state.allowed = false; await refreshExisting(); return; } message('formMessage', 'Документ создан\n\nОбъект: ' + result.objectName + '\nДокумент: ' + result.documentName + '\nСтатус: ' + result.documentStatus + '\nID: ' + result.documentId, 'success'); el('documentForm').reset(); state.allowed = false; el('existingBlock').classList.add('hidden'); message('warning', ''); } catch (error) { message('formMessage', error.message, 'error'); } finally { setBusy(false); } });
  el('logout').addEventListener('click', async () => { const token = state.token; sessionStorage.removeItem('documentWebToken'); state.token = ''; try { await server('webAppLogout', token); } catch (ignored) {} showLogin(); });
  loadApp();
</script></body></html>

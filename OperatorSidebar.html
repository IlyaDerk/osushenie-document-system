<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body{font:13px Arial,sans-serif;color:#202124;margin:0;padding:16px}h2{font-size:18px;margin:0 0 18px}.field{margin-bottom:13px}label,.group-label{display:block;font-weight:600;margin-bottom:5px}input{box-sizing:border-box;width:100%;padding:8px;border:1px solid #dadce0;border-radius:4px}input:focus{border-color:#1a73e8;outline:none}.dates{display:flex;gap:10px}.dates .field{width:50%;margin-bottom:0}.date-group{margin-bottom:13px}.date-label{font-weight:400}.buttons{display:flex;gap:9px;margin-top:8px}button{border:0;border-radius:4px;padding:9px;flex:1;cursor:pointer}.apply{background:#1a73e8;color:#fff}.reset{background:#f1f3f4}button:disabled{opacity:.55;cursor:default}.message{display:none;margin-top:14px;padding:9px;border-radius:4px;line-height:1.4}.message.show{display:block}.loading{background:#e8f0fe;color:#174ea6}.success{background:#e6f4ea;color:#137333}.warning{background:#fef7e0;color:#8d5b00}.error{background:#fce8e6;color:#b3261e}ul{margin:6px 0 0;padding-left:18px}
  </style>
</head>
<body>
  <h2>Фильтры карточки</h2>
  <div class="field"><label for="object">Объект</label><input id="object" list="objects" autocomplete="off"><datalist id="objects"></datalist></div>
  <div class="field"><label for="foreman">Ответственный прораб</label><input id="foreman" list="foremen" autocomplete="off"><datalist id="foremen"></datalist></div>
  <div class="field"><label for="status">Статус документа</label><input id="status" list="statuses" autocomplete="off"><datalist id="statuses"></datalist></div>
  <div class="field"><label for="type">Тип документа</label><input id="type" list="types" autocomplete="off"><datalist id="types"></datalist></div>
  <div class="field"><label for="holder">У кого документ</label><input id="holder" list="holders" autocomplete="off"><datalist id="holders"></datalist></div>
  <div class="date-group">
    <div class="group-label">Дата создания</div>
    <div class="dates">
      <div class="field"><label class="date-label" for="from">От</label><input id="from" type="date"></div>
      <div class="field"><label class="date-label" for="to">До</label><input id="to" type="date"></div>
    </div>
  </div>
  <div class="buttons"><button id="apply" class="apply">Применить</button><button id="reset" class="reset">Очистить фильтры</button></div>
  <div id="state" class="message"></div><div id="result" class="message"></div><div id="warnings" class="message"></div><div id="error" class="message"></div>
<script>
'use strict';
let data={objects:[],foremen:[],employees:[],documentTypes:[],documentStatuses:[]};
const el=id=>document.getElementById(id);
function label(item){return item.isAllObjects?'Все':item.name+' ['+item.id+']'}
function fill(id,items){el(id).innerHTML='';items.forEach(item=>{const option=document.createElement('option');option.value=label(item);el(id).appendChild(option)})}
function fillValues(id,values){el(id).innerHTML='';values.forEach(value=>{const option=document.createElement('option');option.value=value;el(id).appendChild(option)})}
function show(id,text,kind){const node=el(id);node.className='message'+(text?' show '+kind:'');node.textContent=text||''}
function busy(value,text){el('apply').disabled=value;el('reset').disabled=value;show('state',text||'',value?'loading':'')}
function selected(input,items,name){const text=el(input).value.trim();if(!text||text==='Все')return null;const item=items.find(candidate=>label(candidate)===text);if(!item)throw new Error('Выберите '+name+' из справочника.');return item}
function selectedValue(input,values,name){const text=el(input).value.trim();if(!text||text==='Все')return '';const value=values.find(candidate=>candidate===text);if(!value)throw new Error('Выберите '+name+' из справочника.');return value}
function clearMessages(){['result','warnings','error'].forEach(id=>show(id,''))}
function resetFilters(){['object','foreman','status','type','holder'].forEach(id=>el(id).value='Все');el('from').value='';el('to').value='';clearMessages();show('state','')}
el('reset').onclick=resetFilters;
el('apply').onclick=function(){
  clearMessages();let object,foreman,type,holder,status;
  try{
    object=selected('object',data.objects,'объект');foreman=selected('foreman',data.foremen,'прораба');
    status=selectedValue('status',data.documentStatuses,'статус документа');
    type=selected('type',data.documentTypes,'тип документа');holder=selected('holder',data.employees,'держателя');
    if(el('from').value&&el('to').value&&el('from').value>el('to').value)throw new Error('Дата от не может быть позже даты до.');
  }catch(error){show('error',error.message,'error');return}
  const filters={object:!object?{allObjects:true,objectId:'',objectName:'Все'}:{allObjects:false,objectId:object.id,objectName:object.name},foremanId:foreman?foreman.id:'',foremanName:foreman?foreman.name:'',documentStatus:status,documentTypeId:type?type.id:'',documentTypeName:type?type.name:'',holderId:holder?holder.id:'',holderName:holder?holder.name:'',dateFrom:el('from').value,dateTo:el('to').value};
  busy(true,'Загрузка карточки...');
  google.script.run.withSuccessHandler(response=>{busy(false,'');show('result',response.message,response.status==='Успешно'||response.status==='Без изменений'?'success':'warning');if(response.warnings&&response.warnings.length){el('warnings').className='message show warning';el('warnings').innerHTML='<strong>Предупреждения</strong><ul>'+response.warnings.map(w=>'<li>'+escapeHtml(w)+'</li>').join('')+'</ul>'}}).withFailureHandler(error=>{busy(false,'');show('error',error.message||String(error),'error')}).applyOperatorFilters(filters);
};
function escapeHtml(value){const div=document.createElement('div');div.textContent=value;return div.innerHTML}
window.onload=function(){
  busy(true,'Загрузка справочников...');
  google.script.run.withSuccessHandler(result=>{data=result;fill('objects',data.objects||[]);fill('foremen',data.foremen||[]);fillValues('statuses',data.documentStatuses||[]);fill('types',data.documentTypes||[]);fill('holders',data.employees||[]);resetFilters();busy(false,'')}).withFailureHandler(error=>{busy(true,'');show('error',error.message||String(error),'error')}).getOperatorFilterData();
};
</script>
</body>
</html>
